# stock-sdk 内置可选数据源插件
# ⚠️ 合规提示: 本插件通过 stock-sdk 抓取第三方财经网站(如东方财富)的行情接口,
#    未经对方授权,可能违反其服务条款并涉及交易所行情版权问题。
#    启用即视为使用者知悉并自行承担合规责任。
#    需手动安装依赖: cd backend/app/plugins/stocksdk && npm install

name: stocksdk
display_name: "stock-sdk"
runtime: node
entry: app.plugins.stocksdk.provider:StockSDKProvider
check: app.plugins.stocksdk.bridge:availability
datasets: [daily, adj_factor, minute, realtime]
description: "抓取第三方财经网站行情接口(存在版权与反爬风险,使用需自行评估合规责任)。日K/除权/分钟/实时全市场。需运行环境含 Node.js 18+。"
install_hint: "cd backend/app/plugins/stocksdk && npm install(需 Node.js 18+)"
